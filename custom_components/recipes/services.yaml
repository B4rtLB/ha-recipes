add:
  fields:
    url:
      required: true
      example: "https://www.tiktok.com/@user/video/123"
      selector:
        text:
    force:
      required: false
      default: false
      selector:
        boolean:
status:
  fields:
    limit:
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 500
    id:
      required: false
      selector:
        text:
    only:
      required: false
      description: With id and "offers": only the title and the ingredient lines that are on offer.
      selector:
        select:
          options:
            - offers
delete:
  fields:
    id:
      required: true
      selector:
        text:
retry:
  fields:
    id:
      required: false
      selector:
        text:
set_discounts:
  fields:
    store:
      required: true
      example: ah
      selector:
        select:
          options:
            - ah
            - jumbo
            - lidl
            - dirk
    valid_from:
      required: true
      example: "2026-11-09"
      selector:
        date:
    valid_to:
      required: true
      example: "2026-11-15"
      selector:
        date:
    items:
      required: true
      example: '[{"name": "Chicken breast", "terms": ["kipfilet", "chicken breast"], "price": "€4.99", "was": "€6.49", "note": "2nd half price"}]'
      selector:
        object:
refresh_discounts:
  fields:
    store:
      required: false
      example: "[ah, jumbo]"
      selector:
        select:
          multiple: true
          options:
            - ah
            - jumbo
            - lidl
            - dirk
    force:
      required: false
      default: false
      selector:
        boolean:
    test_base:
      required: false
      selector:
        text:
